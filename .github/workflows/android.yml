# Тесты и lint Android-приложения; собирает APK и выкладывает их артефактами запуска
# (Actions → нужный запуск → Artifacts): так можно скачать полную офлайн-сборку (≈ 39 МБ), которую неудобно пересылать.
name: Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK (платформа 34) уже стоит на образе ubuntu-latest, переменная ANDROID_HOME задана.
      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug -Pabis=arm64-v8a

      - name: Build APKs
        run: |
          mkdir -p ../dist
          ./gradlew assembleDebug -Pabis=arm64-v8a
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/reading-tracker-offline-arm64.apk
          ./gradlew assembleDebug -PbundleModel=false
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/reading-tracker-lite-universal.apk
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/app/build/reports/
