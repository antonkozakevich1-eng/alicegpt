name: Clicker APK

on:
  push:
    paths:
      - "clicker-app/**"
      - ".github/workflows/clicker-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clicker-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cosmo-clicker-apk
          path: clicker-app/app/build/outputs/apk/release/app-release.apk
